name: Timesheet automation

on:
  schedule:
    # 12:00 IST = 06:30 UTC. GitHub may delay scheduled jobs slightly.
    - cron: '30 6 * * *'
  workflow_dispatch:

jobs:
  update-timesheet:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run timesheet automation
        run: node timesheet.js
        env:
          HEADLESS: 'true'
          TARGET_HOURS: '9'
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
